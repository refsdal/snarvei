name: Tests

# The single definition of "the suite is green". Reusable: ci.yml (PRs) and,
# from phase 5, release.yml (pushes to main) both call it.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: snarvei
          POSTGRES_PASSWORD: snarvei
          POSTGRES_DB: snarvei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snarvei -d snarvei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://snarvei:snarvei@127.0.0.1:5432/snarvei_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "go bun go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen go:github.com/sqlc-dev/sqlc/cmd/sqlc"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generated API client is current
        run: |
          bun run gen:client
          git diff --exit-code -- apps/frontend/src/lib/api-schema.d.ts || { echo "run 'bun run gen:client' and commit apps/frontend/src/lib/api-schema.d.ts"; exit 1; }
      - name: Lint + typecheck
        run: bun run check
      - name: Frontend tests
        run: bun run test
      - name: Go vet
        run: cd apps/server && go vet ./...
      - name: Go tests
        run: cd apps/server && go test -p 1 -count=1 ./...
